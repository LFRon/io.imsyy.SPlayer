version: "1"

package:
  id: io.imsyy.SPlayer
  name: SPlayer
  version: 3.0.0.5
  kind: app
  description: |
    SPlayer是一个简约的音乐播放器,这是其Linux原生版本

base: org.deepin.base/25.2.1
runtime: 
##Add GTK3 & GTK4 Fcitx5-Frontend
command:
  - "/opt/apps/io.imsyy.SPlayer/files/bin/io.imsyy.SPlayer"

sources:
    - kind: file
      url: https://github.com/imsyy/SPlayer/releases/download/v3.0.0-beta.5/splayer-3.0.0-beta.5-arm64.deb
      digest: 3b3643cad27be659cf495d7b37e927e0bb1cc5229d037017d138b7d0e2661061

build: |
    ## 环境设置
    set -x
    export PATH=$PATH:/usr/libexec/linglong/builder/helper
    # 设置工作目录
    SOURCES="linglong/app-sources"
    # 设置启动二进制文件名称
    BINNAME=${LINGLONG_APPID}
    # 进入工作目录
    cd ${SOURCES}
    
    # 清理多余目录
    rm -rf deb ${LINGLONG_APPID}
    
    # 将deb挪过来并进行解压
    mv ../sources/*.deb target.deb
    dpkg-deb -R target.deb deb

    # 进入应用本体目录将其拷贝出来
    mv deb/opt/SPlayer ${LINGLONG_APPID}
    # 删除多余的deb目录
    rm -rf deb
    # 进入应用目录
    cd ${LINGLONG_APPID}
    # ARM64架构的AppImage不需要拷贝必需libs库,故跳过
    # cp -a usr/lib/* ../libs
    # 删除多余文件
    rm -rf .DirIcon AppRun SPlayer.desktop SPlayer.png usr

    # 退出应用本体目录
    cd ..
    # 删除多余的deb文件
    rm -f target.deb

    #写入启动脚本
    echo "#!/bin/bash" > bin/${BINNAME}
    echo "exec \"${PREFIX}/${LINGLONG_APPID}/SPlayer\" \"\$@\"" >> bin/${BINNAME}
    chmod -R 755 *

    #进行安装
    cp -a bin $PREFIX
    cp -a ${LINGLONG_APPID} $PREFIX
    cp -a share $PREFIX
