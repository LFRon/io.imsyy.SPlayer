version: "1"

package:
  id: io.imsyy.SPlayer
  name: SPlayer
  version: 3.0.0.10
  kind: app
  description: |
    SPlayer是一个简约的音乐播放器,这是其Linux原生版本

base: org.deepin.base/25.2.2
runtime: 
##Add GTK3 & GTK4 Fcitx5-Frontend
command:
  - "/opt/apps/io.imsyy.SPlayer/files/bin/io.imsyy.SPlayer"

sources:
    - kind: file
      url: https://github.com/imsyy/SPlayer/releases/download/v3.0.0/splayer-3.0.0-arm64.deb
      digest: 2db509efefcaa0e142bd9f36991c8b89991bc28342b8f39cdfb9ddce684668ba

build: |
    ## 环境设置
    set -x
    export PATH=$PATH:/usr/libexec/linglong/builder/helper
    # 设置工作目录
    SOURCES="linglong/app-sources"
    # 设置启动二进制文件名称
    BINNAME=${LINGLONG_APPID}
    # 进入工作目录
    cd ${SOURCES}
    
    # 清理多余目录
    rm -rf deb ${LINGLONG_APPID}
    
    # 将deb挪过来并进行解压
    mv ../sources/*.deb target.deb
    dpkg-deb -R target.deb deb

    # 进入应用本体目录将应用本体拷贝出来
    mv deb/opt/SPlayer ${LINGLONG_APPID}

    # 删除多余的deb目录与安装包
    rm -rf deb target.deb

    # 写入启动脚本
    echo "#!/bin/bash" > bin/${BINNAME}
    echo "exec \"${PREFIX}/${LINGLONG_APPID}/SPlayer\" \"--no-sandbox\" \"\$@\"" >> bin/${BINNAME}
    chmod -R 755 bin/*

    # 进行安装
    cp -a bin $PREFIX
    cp -a ${LINGLONG_APPID} $PREFIX
    cp -a share $PREFIX
